<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found – ReceiptToCSV</title>
    <script>
      // Static hosts serve this for unknown paths. Hand the URL to the app, which shows the right
      // page (or its own "Page not found"); index.html reads sessionStorage.redirect on load.
      sessionStorage.redirect = location.href;
      location.replace('/');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f9fafb;
        color: #111827;
        font: 15px/24px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 420px; }
      h1 { font-size: 22px; line-height: 30px; font-weight: 600; margin: 0 0 8px; }
      p { color: #4b5563; margin: 0 0 24px; }
      a {
        display: inline-block;
        background: #1f5fbf;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 16px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's nothing at this address. It may have moved, or the link has a typo.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
